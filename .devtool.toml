version = 1

[project]
name = "DownKit"

[extension.project]
loader = "go"

[extension.project.loader_config]
module = "./devcontrol"
package = "./cmd/provider"

[extension.environment]
loader = "go-module"

[extension.environment.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/environment/docker/cmd/provider"

[extension.environment.settings]
image = "ghcr.io/thinkerqaq/dev-base@sha256:f922f24b2dd917faa87bfc090dd90321aaf82651cc9a2de320a22519c3b77a8e"

[extension.runtime]
loader = "go-module"

[extension.runtime.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/runtime/dagger/cmd/provider"

[extension.code-capability]
loader = "go-module"

[extension.code-capability.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/capability/code/cmd/provider"

[extension.codegraph]
loader = "go-module"

[extension.codegraph.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/intelligence/codegraph/cmd/provider"

[extension.lsp]
loader = "go-module"

[extension.lsp.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/intelligence/serena/cmd/provider"

[extension.scm]
loader = "go-module"

[extension.scm.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/scm/github/cmd/provider"

[service.environment]
provider = "environment.docker"

[service.portable-runtime]
provider = "runtime.dagger"

[service.code-indexed]
provider = "intelligence.codegraph"

[service.code-realtime]
provider = "intelligence.lsp.serena"

[service.scm]
provider = "scm.github"

[code]
workspaces = ["."]

[profile.local.extension.environment]
loader = "go-module"

[profile.local.extension.environment.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/environment/local/cmd/provider"

[profile.local.service.environment]
provider = "environment.local"

[profile.railway.extension.environment]
loader = "go-module"

[profile.railway.extension.environment.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/environment/local/cmd/provider"

[profile.railway.service.environment]
provider = "environment.local"

[extension.document-capability]
loader = "go-module"
[extension.document-capability.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/capability/document/cmd/provider"

[extension.document-context]
loader = "go-module"
[extension.document-context.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/context/document/cmd/provider"
[extension.document-context.settings]
review_max_lines = 250

[extension.document-realtime]
loader = "go-module"
[extension.document-realtime.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/document/marksman/cmd/provider"
[extension.document-realtime.settings]
binary = "marksman"
timeout_seconds = 30
workspace_roots = ["."]

[extension.document-markdown]
loader = "go-module"
[extension.document-markdown.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/document/markdown/cmd/provider"
[extension.document-markdown.settings]
roots = ["docs", "README.md", "README_ZH.md", "AGENTS.md"]

[service.document-context]
provider = "context.document.composite"
[service.document-realtime]
provider = "document.realtime.marksman"
[service.document-structure]
provider = "document.markdown.goldmark"

# DevTool V2 service wiring: code context and SCM credentials.

[extension.code-context]
loader = "go-module"

[extension.code-context.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/context/code/cmd/provider"

[extension.credential-store]
loader = "go-module"

[extension.credential-store.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/credential/file/cmd/provider"

[extension.credential]
loader = "go-module"

[extension.credential.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/credential/github/cmd/provider"

[extension.scm-capability]
loader = "go-module"

[extension.scm-capability.loader_config]
module = "github.com/thinkerqaq/devtool"
version = "f4765787bbb20540b6a5e5d8d7293ef393fd9757"
package = "./extensions/capability/scm/cmd/provider"

[service.code-context]
provider = "context.code.composite"

[service.credential-store]
provider = "credential.store.file"

[service.credential]
provider = "credential.github"
